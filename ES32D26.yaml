esphome:
  name: "es32d26"
  friendly_name: "ES32D26-PLC"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Confirme que le port RS485/UART est initialisé.
          id(rs485_ready).publish_state(true);

          // Applique le mode de démarrage choisi (via select) pour chaque relais.
          // Tourne en priorité très basse pour s'assurer que les selects/globals sont déjà restaurés.
          if (id(relay_ch1_boot_mode).current_option() == "Toujours ON") { id(relay_ch1).turn_on(); }
          else if (id(relay_ch1_boot_mode).current_option() == "Toujours OFF") { id(relay_ch1).turn_off(); }
          else { if (id(relay_ch1_last_state)) id(relay_ch1).turn_on(); else id(relay_ch1).turn_off(); }

          if (id(relay_ch2_boot_mode).current_option() == "Toujours ON") { id(relay_ch2).turn_on(); }
          else if (id(relay_ch2_boot_mode).current_option() == "Toujours OFF") { id(relay_ch2).turn_off(); }
          else { if (id(relay_ch2_last_state)) id(relay_ch2).turn_on(); else id(relay_ch2).turn_off(); }

          if (id(relay_ch3_boot_mode).current_option() == "Toujours ON") { id(relay_ch3).turn_on(); }
          else if (id(relay_ch3_boot_mode).current_option() == "Toujours OFF") { id(relay_ch3).turn_off(); }
          else { if (id(relay_ch3_last_state)) id(relay_ch3).turn_on(); else id(relay_ch3).turn_off(); }

          if (id(relay_ch4_boot_mode).current_option() == "Toujours ON") { id(relay_ch4).turn_on(); }
          else if (id(relay_ch4_boot_mode).current_option() == "Toujours OFF") { id(relay_ch4).turn_off(); }
          else { if (id(relay_ch4_last_state)) id(relay_ch4).turn_on(); else id(relay_ch4).turn_off(); }

          if (id(relay_ch5_boot_mode).current_option() == "Toujours ON") { id(relay_ch5).turn_on(); }
          else if (id(relay_ch5_boot_mode).current_option() == "Toujours OFF") { id(relay_ch5).turn_off(); }
          else { if (id(relay_ch5_last_state)) id(relay_ch5).turn_on(); else id(relay_ch5).turn_off(); }

          if (id(relay_ch6_boot_mode).current_option() == "Toujours ON") { id(relay_ch6).turn_on(); }
          else if (id(relay_ch6_boot_mode).current_option() == "Toujours OFF") { id(relay_ch6).turn_off(); }
          else { if (id(relay_ch6_last_state)) id(relay_ch6).turn_on(); else id(relay_ch6).turn_off(); }

          if (id(relay_ch7_boot_mode).current_option() == "Toujours ON") { id(relay_ch7).turn_on(); }
          else if (id(relay_ch7_boot_mode).current_option() == "Toujours OFF") { id(relay_ch7).turn_off(); }
          else { if (id(relay_ch7_last_state)) id(relay_ch7).turn_on(); else id(relay_ch7).turn_off(); }

          if (id(relay_ch8_boot_mode).current_option() == "Toujours ON") { id(relay_ch8).turn_on(); }
          else if (id(relay_ch8_boot_mode).current_option() == "Toujours OFF") { id(relay_ch8).turn_off(); }
          else { if (id(relay_ch8_last_state)) id(relay_ch8).turn_on(); else id(relay_ch8).turn_off(); }
esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
logger:
  # baud_rate: 0 désactive la sortie log par UART matériel (GPIO1/GPIO3) - nécessaire car ces
  # broches sont maintenant utilisées pour le RS485. Les logs restent disponibles par WiFi/API
  baud_rate: 0
  logs:
    component: DEBUG
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ES32D26 Fallback Hotspot"
    password: !secret ap_password
captive_portal:

######################
### section relais ###
######################
sn74hc595:
  - id: sn74hc595_hub
    data_pin: GPIO12
    clock_pin: GPIO22
    latch_pin: GPIO23
    oe_pin: GPIO13
    sr_count: 1
switch:
  - platform: gpio
    name: "CH1 Relay"
    id: relay_ch1
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: sn74hc595_hub
      number: 0
      inverted: false
    on_turn_on:
      - globals.set: {id: relay_ch1_last_state, value: 'true'}
    on_turn_off:
      - globals.set: {id: relay_ch1_last_state, value: 'false'}
  - platform: gpio
    name: "CH2 Relay"
    id: relay_ch2
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: sn74hc595_hub
      number: 1
      inverted: false
    on_turn_on:
      - globals.set: {id: relay_ch2_last_state, value: 'true'}
    on_turn_off:
      - globals.set: {id: relay_ch2_last_state, value: 'false'}
  - platform: gpio
    name: "CH3 Relay"
    id: relay_ch3
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: sn74hc595_hub
      number: 2
      inverted: false
    on_turn_on:
      - globals.set: {id: relay_ch3_last_state, value: 'true'}
    on_turn_off:
      - globals.set: {id: relay_ch3_last_state, value: 'false'}
  - platform: gpio
    name: "CH4 Relay"
    id: relay_ch4
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: sn74hc595_hub
      number: 3
      inverted: false
    on_turn_on:
      - globals.set: {id: relay_ch4_last_state, value: 'true'}
    on_turn_off:
      - globals.set: {id: relay_ch4_last_state, value: 'false'}
  - platform: gpio
    name: "CH5 Relay"
    id: relay_ch5
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: sn74hc595_hub
      number: 4
      inverted: false
    on_turn_on:
      - globals.set: {id: relay_ch5_last_state, value: 'true'}
    on_turn_off:
      - globals.set: {id: relay_ch5_last_state, value: 'false'}
  - platform: gpio
    name: "CH6 Relay"
    id: relay_ch6
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: sn74hc595_hub
      number: 5
      inverted: false
    on_turn_on:
      - globals.set: {id: relay_ch6_last_state, value: 'true'}
    on_turn_off:
      - globals.set: {id: relay_ch6_last_state, value: 'false'}
  - platform: gpio
    name: "CH7 Relay"
    id: relay_ch7
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: sn74hc595_hub
      number: 6
      inverted: false
    on_turn_on:
      - globals.set: {id: relay_ch7_last_state, value: 'true'}
    on_turn_off:
      - globals.set: {id: relay_ch7_last_state, value: 'false'}
  - platform: gpio
    name: "CH8 Relay"
    id: relay_ch8
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: sn74hc595_hub
      number: 7
      inverted: false
    on_turn_on:
      - globals.set: {id: relay_ch8_last_state, value: 'true'}
    on_turn_off:
      - globals.set: {id: relay_ch8_last_state, value: 'false'}

# Master switch pour allumer et éteindre tout les relais en même temps (optionel):
  - platform: template
    name: "CH 1-8 - All Relays"
    id: master_switch
    restore_mode: ALWAYS_OFF
    lambda: |-
      if (id(relay_ch1).state && id(relay_ch2).state && id(relay_ch3).state &&
          id(relay_ch4).state && id(relay_ch5).state && id(relay_ch6).state &&
          id(relay_ch7).state && id(relay_ch8).state) {
        return true;
      } else if (!id(relay_ch1).state && !id(relay_ch2).state && !id(relay_ch3).state &&
                 !id(relay_ch4).state && !id(relay_ch5).state && !id(relay_ch6).state &&
                 !id(relay_ch7).state && !id(relay_ch8).state) {
        return false;
      } else {
        return {};
      }
    turn_on_action:
      - switch.turn_on: relay_ch1
      - switch.turn_on: relay_ch2
      - switch.turn_on: relay_ch3
      - switch.turn_on: relay_ch4
      - switch.turn_on: relay_ch5
      - switch.turn_on: relay_ch6
      - switch.turn_on: relay_ch7
      - switch.turn_on: relay_ch8
    turn_off_action:
      - switch.turn_off: relay_ch1
      - switch.turn_off: relay_ch2
      - switch.turn_off: relay_ch3
      - switch.turn_off: relay_ch4
      - switch.turn_off: relay_ch5
      - switch.turn_off: relay_ch6
      - switch.turn_off: relay_ch7
      - switch.turn_off: relay_ch8

##################################
### Section entrées numériques ###
##################################
sn74hc165:
  - id: sn74hc165_hub
    clock_pin: GPIO2
    data_pin: GPIO15
    load_pin: GPIO0
    sr_count: 1
binary_sensor:
  # Confirme que le port RS485/UART s'est initialisé correctement au démarrage - ne détecte PAS
  # la présence d'un appareil réel sur le bus (Modbus n'a pas de mécanisme générique pour ça),
  # juste que le port lui-même est prêt à communiquer.
  - platform: template
    name: "RS485 Prêt"
    id: rs485_ready
    device_class: connectivity
    entity_category: diagnostic
  - platform: gpio
    name: "IN1 Digital Input"
    id: din_in1
    pin:
      sn74hc165: sn74hc165_hub
      number: 0
      inverted: true
  - platform: gpio
    name: "IN2 Digital Input"
    id: din_in2
    pin:
      sn74hc165: sn74hc165_hub
      number: 1
      inverted: true
  - platform: gpio
    name: "IN3 Digital Input"
    id: din_in3
    pin:
      sn74hc165: sn74hc165_hub
      number: 2
      inverted: true
  - platform: gpio
    name: "IN4 Digital Input"
    id: din_in4
    pin:
      sn74hc165: sn74hc165_hub
      number: 3
      inverted: true
  - platform: gpio
    name: "IN5 Digital Input"
    id: din_in5
    pin:
      sn74hc165: sn74hc165_hub
      number: 4
      inverted: true
  - platform: gpio
    name: "IN6 Digital Input"
    id: din_in6
    pin:
      sn74hc165: sn74hc165_hub
      number: 5
      inverted: true
  - platform: gpio
    name: "IN7 Digital Input"
    id: din_in7
    pin:
      sn74hc165: sn74hc165_hub
      number: 6
      inverted: true
  - platform: gpio
    name: "IN8 Digital Input"
    id: din_in8
    pin:
      sn74hc165: sn74hc165_hub
      number: 7
      inverted: true

###################################
### Section sorties analogiques ###
###################################
# Vo1/Io1 partagent GPIO25, Vo2/Io2 partagent GPIO26 (multiplexé matériellement via le DIP switch SW1).
# 4 combinaisons possibles selon la position du DIP switch: Vo1+Vo2, Vo1+Io2, Io1+Vo2, Io1+Io2.
# Le "select" ci-dessous indique au firmware quelle position le DIP switch occupe réellement pour
# chaque canal, afin d'appliquer la bonne calibration (tension 0-10V ou courant 0-20mA).
# Aucune édition YAML requise pour changer de mode: tout se fait depuis Home Assistant.
output:
  - platform: esp32_dac
    pin: GPIO25
    id: dac_ch1
  - platform: esp32_dac
    pin: GPIO26
    id: dac_ch2

globals:
  - id: ch1_mode_current   # false = Vo1 (0-10V), true = Io1 (0-20mA)
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ch2_mode_current   # false = Vo2 (0-10V), true = Io2 (0-20mA)
    type: bool
    restore_value: true
    initial_value: 'false'
  # --- Dernier état connu de chaque relais, pour le mode "Dernier état" au démarrage ---
  - id: relay_ch1_last_state
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: relay_ch2_last_state
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: relay_ch3_last_state
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: relay_ch4_last_state
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: relay_ch5_last_state
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: relay_ch6_last_state
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: relay_ch7_last_state
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: relay_ch8_last_state
    type: bool
    restore_value: true
    initial_value: 'false'

select:
  - platform: template
    name: "Sortie analogique 1 - mode d'opération"
    id: ch1_mode_select
    optimistic: true
    restore_value: true
    options:
      - "Tension 0-10V (Vo1)"
      - "Courant 0-20mA (Io1)"
    initial_option: "Tension 0-10V (Vo1)"
    set_action:
      - lambda: |-
          id(ch1_mode_current) = (x == "Courant 0-20mA (Io1)");
  - platform: template
    name: "Sortie analogique 2 - mode d'opération"
    id: ch2_mode_select
    optimistic: true
    restore_value: true
    options:
      - "Tension 0-10V (Vo2)"
      - "Courant 0-20mA (Io2)"
    initial_option: "Tension 0-10V (Vo2)"
    set_action:
      - lambda: |-
          id(ch2_mode_current) = (x == "Courant 0-20mA (Io2)");

  # --- Mode de démarrage par relais, ajustable depuis Home Assistant, persiste via restore_value ---
  - platform: template
    name: "CH1 Relay - Mode démarrage"
    id: relay_ch1_boot_mode
    optimistic: true
    restore_value: true
    options: ["Toujours OFF", "Toujours ON", "Dernier état"]
    initial_option: "Toujours OFF"
  - platform: template
    name: "CH2 Relay - Mode démarrage"
    id: relay_ch2_boot_mode
    optimistic: true
    restore_value: true
    options: ["Toujours OFF", "Toujours ON", "Dernier état"]
    initial_option: "Toujours OFF"
  - platform: template
    name: "CH3 Relay - Mode démarrage"
    id: relay_ch3_boot_mode
    optimistic: true
    restore_value: true
    options: ["Toujours OFF", "Toujours ON", "Dernier état"]
    initial_option: "Toujours OFF"
  - platform: template
    name: "CH4 Relay - Mode démarrage"
    id: relay_ch4_boot_mode
    optimistic: true
    restore_value: true
    options: ["Toujours OFF", "Toujours ON", "Dernier état"]
    initial_option: "Toujours OFF"
  - platform: template
    name: "CH5 Relay - Mode démarrage"
    id: relay_ch5_boot_mode
    optimistic: true
    restore_value: true
    options: ["Toujours OFF", "Toujours ON", "Dernier état"]
    initial_option: "Toujours OFF"
  - platform: template
    name: "CH6 Relay - Mode démarrage"
    id: relay_ch6_boot_mode
    optimistic: true
    restore_value: true
    options: ["Toujours OFF", "Toujours ON", "Dernier état"]
    initial_option: "Toujours OFF"
  - platform: template
    name: "CH7 Relay - Mode démarrage"
    id: relay_ch7_boot_mode
    optimistic: true
    restore_value: true
    options: ["Toujours OFF", "Toujours ON", "Dernier état"]
    initial_option: "Toujours OFF"
  - platform: template
    name: "CH8 Relay - Mode démarrage"
    id: relay_ch8_boot_mode
    optimistic: true
    restore_value: true
    options: ["Toujours OFF", "Toujours ON", "Dernier état"]
    initial_option: "Toujours OFF"

number:
  # --- Contrôles principaux (0-100%) ---
  - platform: template
    name: "Sortie analogique 1 %"
    id: ch1_level
    min_value: 0
    max_value: 100
    step: 0.5
    unit_of_measurement: "%"
    icon: "mdi:sine-wave"
    optimistic: true
    restore_value: true
    initial_value: 0
    set_action:
      - lambda: |-
          // Réponse confirmée linéaire par mesure (0/50/100%), donc level = pourcentage direct
          id(dac_ch1).set_level(x / 100.0);
  - platform: template
    name: "Sortie analogique 2 %"
    id: ch2_level
    min_value: 0
    max_value: 100
    step: 0.5
    unit_of_measurement: "%"
    icon: "mdi:sine-wave"
    optimistic: true
    restore_value: true
    initial_value: 0
    set_action:
      - lambda: |-
          id(dac_ch2).set_level(x / 100.0);

  # --- Calibration Vo1/Io1 en 3 points (0%, 50%, 100%), ajustable depuis Home Assistant, persiste via restore_value ---
  - platform: template
    name: "Calib Vo1 - Valeur à 0%"
    id: ch1_offset_v
    min_value: 0
    max_value: 3
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 0.28
  - platform: template
    name: "Calib Vo1 - Valeur à 50%"
    id: ch1_mid_v
    min_value: 3
    max_value: 7
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 5.00
  - platform: template
    name: "Calib Vo1 - Valeur à 100%"
    id: ch1_fullscale_v
    min_value: 8
    max_value: 11
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 9.77
  - platform: template
    name: "Calib Io1 - Valeur à 0%"
    id: ch1_offset_ma
    min_value: 0
    max_value: 5
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 0.0
  - platform: template
    name: "Calib Io1 - Valeur à 50%"
    id: ch1_mid_ma
    min_value: 5
    max_value: 15
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 10.0
  - platform: template
    name: "Calib Io1 - Valeur à 100%"
    id: ch1_fullscale_ma
    min_value: 15
    max_value: 22
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 20.0

  # --- Calibration Vo2/Io2 en 3 points ---
  - platform: template
    name: "Calib Vo2 - Valeur à 0%"
    id: ch2_offset_v
    min_value: 0
    max_value: 3
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 0.26
  - platform: template
    name: "Calib Vo2 - Valeur à 50%"
    id: ch2_mid_v
    min_value: 3
    max_value: 7
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 4.97
  - platform: template
    name: "Calib Vo2 - Valeur à 100%"
    id: ch2_fullscale_v
    min_value: 8
    max_value: 11
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 9.76
  - platform: template
    name: "Calib Io2 - Valeur à 0%"
    id: ch2_offset_ma
    min_value: 0
    max_value: 5
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 0.0
  - platform: template
    name: "Calib Io2 - Valeur à 50%"
    id: ch2_mid_ma
    min_value: 5
    max_value: 15
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 10.0
  - platform: template
    name: "Calib Io2 - Valeur à 100%"
    id: ch2_fullscale_ma
    min_value: 15
    max_value: 22
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 20.0

  # --- Calibration Vi1 (2 points), ajustable depuis Home Assistant, persiste via restore_value ---
  # Entre la valeur réellement appliquée (référence précise) et la valeur lue par le ESP32 à ce
  # même point, pour 2 points différents. Le firmware calcule automatiquement le gain et le
  # décalage à partir de ces 2 points et corrige chaque lecture du bouton de mesure ponctuelle.
  - platform: template
    name: "Calib Vi1 - Point bas (appliqué)"
    id: vi1_cal_low_applied
    min_value: 0
    max_value: 10
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 6.00
  - platform: template
    name: "Calib Vi1 - Point bas (lu)"
    id: vi1_cal_low_read
    min_value: 0
    max_value: 10
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 6.11
  - platform: template
    name: "Calib Vi1 - Point haut (appliqué)"
    id: vi1_cal_high_applied
    min_value: 0
    max_value: 12
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 9.76
  - platform: template
    name: "Calib Vi1 - Point haut (lu)"
    id: vi1_cal_high_read
    min_value: 0
    max_value: 12
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 9.92

  # --- Calibration Ii1 (3 points), ajustable depuis Home Assistant ---
  # Un 2e point (4.1mA) ne suffisait pas à extrapoler correctement jusqu'à 0mA (relation pas
  # parfaitement linéaire sur toute la plage) - on ajoute donc un point bas réel à 0mA.
  - platform: template
    name: "Calib Ii1 - Point bas (appliqué)"
    id: ii1_cal_low_applied
    min_value: 0
    max_value: 20
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 0.0
  - platform: template
    name: "Calib Ii1 - Point bas (lu)"
    id: ii1_cal_low_read
    min_value: -10
    max_value: 20
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: -3.98
  - platform: template
    name: "Calib Ii1 - Point milieu (appliqué)"
    id: ii1_cal_mid_applied
    min_value: 0
    max_value: 20
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 4.1
  - platform: template
    name: "Calib Ii1 - Point milieu (lu)"
    id: ii1_cal_mid_read
    min_value: 0
    max_value: 20
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 0.11
  - platform: template
    name: "Calib Ii1 - Point haut (appliqué)"
    id: ii1_cal_high_applied
    min_value: 0
    max_value: 22
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 20.0
  - platform: template
    name: "Calib Ii1 - Point haut (lu)"
    id: ii1_cal_high_read
    min_value: 0
    max_value: 22
    step: 0.01
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 20.0

text_sensor:
  - platform: template
    name: "Sortie 1 valeur réelle"
    lambda: |-
      char buf[16];
      float pct = id(ch1_level).state / 100.0;
      float v;
      if (id(ch1_mode_current)) {
        float lo = id(ch1_offset_ma).state;
        float mid = id(ch1_mid_ma).state;
        float hi = id(ch1_fullscale_ma).state;
        v = (pct <= 0.5) ? (lo + (pct / 0.5) * (mid - lo)) : (mid + ((pct - 0.5) / 0.5) * (hi - mid));
        snprintf(buf, sizeof(buf), "%.2f mA", v);
      } else {
        float lo = id(ch1_offset_v).state;
        float mid = id(ch1_mid_v).state;
        float hi = id(ch1_fullscale_v).state;
        v = (pct <= 0.5) ? (lo + (pct / 0.5) * (mid - lo)) : (mid + ((pct - 0.5) / 0.5) * (hi - mid));
        snprintf(buf, sizeof(buf), "%.2f V", v);
      }
      return std::string(buf);
    update_interval: 2s
  - platform: template
    name: "Sortie 2 valeur réelle"
    lambda: |-
      char buf[16];
      float pct = id(ch2_level).state / 100.0;
      float v;
      if (id(ch2_mode_current)) {
        float lo = id(ch2_offset_ma).state;
        float mid = id(ch2_mid_ma).state;
        float hi = id(ch2_fullscale_ma).state;
        v = (pct <= 0.5) ? (lo + (pct / 0.5) * (mid - lo)) : (mid + ((pct - 0.5) / 0.5) * (hi - mid));
        snprintf(buf, sizeof(buf), "%.2f mA", v);
      } else {
        float lo = id(ch2_offset_v).state;
        float mid = id(ch2_mid_v).state;
        float hi = id(ch2_fullscale_v).state;
        v = (pct <= 0.5) ? (lo + (pct / 0.5) * (mid - lo)) : (mid + ((pct - 0.5) / 0.5) * (hi - mid));
        snprintf(buf, sizeof(buf), "%.2f V", v);
      }
      return std::string(buf);
    update_interval: 2s

####################################
### Section entrées anaglogiques ###
####################################
# ATTENTION: Vi1 (GPIO14) et Vi3 (GPIO27) utilisent l'ADC2 du ESP32, qui est partagé avec le WiFi
# au niveau matériel. le WiFi réserve complètement l'ADC2 tant qu'il tourne.
# Solution retenue: Vi1/Vi3 n'ont plus de lecture automatique périodique (inutile, échoue toujours).
# À la place, le bouton "Vi1/Vi3 - Mesure ponctuelle" ci-dessous coupe complètement le WiFi, lit les
# deux broches (plus de conflit possible, ADC2 libre), puis rallume le WiFi. L'appareil disparaît
# quelques secondes de Home Assistant pendant l'opération (reconnexion WiFi), c'est normal.
# Vi2 (GPIO33) et Vi4 (GPIO32) sont sur ADC1, non affecté par le WiFi - aucun changement nécessaire.
sensor:
  # Vi1 (GPIO14, ADC2) - pas de lecture périodique automatique, voir bouton de mesure ponctuelle plus bas.
  - platform: template
    name: "Vi1 Voltage Input"
    id: vi1
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: never
    icon: "mdi:flash"
  - platform: adc
    pin:
      number: GPIO33
      mode:
        input: true
    name: "Vi2 Voltage Input"
    id: vi2
    attenuation: auto
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - lambda: return x / 10.0 * (10.0 + 43.0);
      - round: 2
    icon: "mdi:flash"
  # Vi3 (GPIO27, ADC2) - pas de lecture périodique automatique, voir bouton de mesure ponctuelle plus bas.
  - platform: template
    name: "Vi3 Voltage Input"
    id: vi3
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: never
    icon: "mdi:flash"

  - platform: adc
    pin:
      number: GPIO32
      mode:
        input: true
    name: "Vi4 Voltage Input"
    id: vi4
    attenuation: auto
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - lambda: return x / 10.0 * (10.0 + 43.0);
      - round: 2
    icon: "mdi:flash"
  - platform: adc
    pin:
      number: GPIO34
      mode:
        input: true
    name: "Ii1 Current Input"
    id: ii1
    attenuation: auto
    update_interval: 5s
    unit_of_measurement: "mA"
    accuracy_decimals: 2
    filters:
      - lambda: |-
          float min_v = 0.364;
          float max_v = 1.82;
          float ma = (x - min_v) * 20.0 / (max_v - min_v);
          return ma;
      # Correction 3 points empirique (interpolation par segments) - ajustable depuis Home
      # Assistant via les curseurs "Calib Ii1". Clamp final ici seulement, après calibration.
      - lambda: |-
          float lo_a = id(ii1_cal_low_applied).state;
          float lo_r = id(ii1_cal_low_read).state;
          float mid_a = id(ii1_cal_mid_applied).state;
          float mid_r = id(ii1_cal_mid_read).state;
          float hi_a = id(ii1_cal_high_applied).state;
          float hi_r = id(ii1_cal_high_read).state;
          float corrected;
          if (x <= mid_r) {
            float gain = (mid_r != lo_r) ? (mid_a - lo_a) / (mid_r - lo_r) : 1.0f;
            corrected = lo_a + (x - lo_r) * gain;
          } else {
            float gain = (hi_r != mid_r) ? (hi_a - mid_a) / (hi_r - mid_r) : 1.0f;
            corrected = mid_a + (x - mid_r) * gain;
          }
          if (corrected < 0.0) corrected = 0.0;
          if (corrected > 20.0) corrected = 20.0;
          return corrected;
      - round: 2
    icon: "mdi:current-dc"
  - platform: adc
    pin:
      number: GPIO39
      mode:
        input: true
    name: "Ii2 Current Input"
    id: ii2
    attenuation: auto
    update_interval: 5s
    unit_of_measurement: "mA"
    accuracy_decimals: 2
    filters:
      - lambda: |-
          float min_v = 0.364;
          float max_v = 1.82;
          float ma = (x - min_v) * 20.0 / (max_v - min_v);
          if (ma < 0.0) ma = 0.0;
          if (ma > 20.0) ma = 20.0;
          return ma;
      - round: 2
    icon: "mdi:current-dc"
  - platform: adc
    pin:
      number: GPIO35
      mode:
        input: true
    name: "Ii3 Current Input"
    id: ii3
    attenuation: auto
    update_interval: 5s
    unit_of_measurement: "mA"
    accuracy_decimals: 2
    filters:
      - lambda: |-
          float min_v = 0.364;
          float max_v = 1.82;
          float ma = (x - min_v) * 20.0 / (max_v - min_v);
          if (ma < 0.0) ma = 0.0;
          if (ma > 20.0) ma = 20.0;
          return ma;
      - round: 2
    icon: "mdi:current-dc"
  - platform: adc
    pin:
      number: GPIO36
      mode:
        input: true
    name: "Ii4 Current Input"
    id: ii4
    attenuation: auto
    update_interval: 5s
    unit_of_measurement: "mA"
    accuracy_decimals: 2
    filters:
      - lambda: |-
          float min_v = 0.364;
          float max_v = 1.82;
          float ma = (x - min_v) * 20.0 / (max_v - min_v);
          if (ma < 0.0) ma = 0.0;
          if (ma > 20.0) ma = 20.0;
          return ma;
      - round: 2
    icon: "mdi:current-dc"

  # --- Signal WiFi ---
  - platform: wifi_signal
    name: "WiFi Signal dBm"
    id: wifi_signal_dbm
    update_interval: 60s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_signal_dbm
    name: "WiFi Signal %"
    unit_of_measurement: "%"
    icon: "mdi:wifi"
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: |-
          int32_t dbm = (int32_t) x;
          int32_t quality;
          if (dbm <= -100) quality = 0;
          else if (dbm >= -50) quality = 100;
          else quality = 2 * (dbm + 100);
          return quality;

# Mesure ponctuelle Vi1/Vi3: coupe complètement le WiFi, lit les 2 broches
# ADC2 sans aucun conflit possible, puis rallume le WiFi. L'appareil disparaît quelques secondes de
# Home Assistant pendant la reconnexion - normal, la mesure reste affichée une fois reconnecté.
button:
  - platform: template
    name: "Vi1 / Vi3 - Mesure ponctuelle"
    id: vi1_vi3_manual_read
    icon: "mdi:flash-triangle"
    on_press:
      - wifi.disable:
      - delay: 300ms
      - lambda: |-
          analogSetPinAttenuation(14, ADC_11db);
          analogSetPinAttenuation(27, ADC_11db);
          // analogReadMilliVolts() applique la calibration d'usine du ESP32 (contrairement à
          // analogRead() + conversion manuelle, qui suppose une réponse linéaire inexacte à 11dB).
          int mv1 = analogReadMilliVolts(14);
          int mv3 = analogReadMilliVolts(27);
          float v1_raw = (mv1 / 1000.0f) / 10.0f * (10.0f + 43.0f);
          float v3_raw = (mv3 / 1000.0f) / 10.0f * (10.0f + 43.0f);

          // Correction 2 points pour Vi1 (gain + décalage calculés à partir des curseurs de calibration)
          float lo_a = id(vi1_cal_low_applied).state;
          float lo_r = id(vi1_cal_low_read).state;
          float hi_a = id(vi1_cal_high_applied).state;
          float hi_r = id(vi1_cal_high_read).state;
          float gain = (hi_r != lo_r) ? (hi_a - lo_a) / (hi_r - lo_r) : 1.0f;
          float offset = lo_a - gain * lo_r;
          float v1 = v1_raw * gain + offset;

          id(vi1).publish_state(v1);
          id(vi3).publish_state(v3_raw);
      - wifi.enable:

#############################
### Section RS485 / Modbus ###
#############################
# Infrastructure de base seulement - permet de brancher un appareil Modbus RTU plus tard sans
# reconstruire cette partie. Les capteurs spécifiques à un appareil précis (registres, adresses,
# types de données) devront être ajoutés une fois l'appareil connu: chaque appareil Modbus a sa
# propre carte de registres, impossible à préparer de façon générique à l'avance.
# GPIO1 (TX0) / GPIO3 (RX0) sont câblés en dur sur le ES32D26 vers la puce transceiver RS485;
# GPIO21 est la broche DE/RE (contrôle d'émission/réception, requis car RS485 est half-duplex).
uart:
  id: rs485_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  flow_control_pin: GPIO21

modbus:
  id: rs485_modbus
  uart_id: rs485_uart
